<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta
      name="description"
      content="Culprit is a local, deterministic incident-analysis console for investigating suspicious commits."
    />
    <meta name="theme-color" content="#0b1220" />
    <meta name="color-scheme" content="dark" />
    <title>Culprit — Incident analysis</title>
  </head>
  <body>
    <a class="skip-link" href="#result-title">Skip to results</a>
    <main id="app" class="shell">
      <header class="site-header">
        <p class="wordmark">Culprit</p>
        <p class="purpose">Find the commits worth checking first, with evidence you can verify.</p>
      </header>
      <section id="input-panel" class="panel" aria-labelledby="input-title">
        <h2 id="input-title">Load an incident</h2>
        <div id="case-picker" class="case-picker"></div>
      </section>
      <div id="status-region" class="status-region">
        <div class="status-banner" hidden></div>
        <p id="status" class="status-announcer visually-hidden" role="status" aria-live="polite" aria-atomic="true"></p>
      </div>
      <section id="result" class="panel" aria-labelledby="result-title">
        <h2 id="result-title" tabindex="-1" hidden></h2>
        <div id="result-body"></div>
      </section>
    </main>
    <noscript>
      <p class="noscript-message">Culprit needs JavaScript enabled to run its local analysis console.</p>
    </noscript>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
